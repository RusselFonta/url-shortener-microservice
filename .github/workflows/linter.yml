
name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: format, lint, test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: url_app_user
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: url_shortener_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create test environment file
        run: |
          echo "NODE_ENV=test" >> .env.test
          echo "DATABASE_URL_TEST=postgresql://url_app_user:ci_test_password@localhost:5432/url_shortener_test" >> .env.test

      - name: Check formatting
        run: npm run format:check

      - name: Run ESLint
        run: npm run lint

      - name: Run tests and initialize test database
        env:
          NODE_ENV: test
          DATABASE_URL_TEST: postgresql://url_app_user:ci_test_password@localhost:5432/url_shortener_test
          PORT: 3000
        run: npm test
